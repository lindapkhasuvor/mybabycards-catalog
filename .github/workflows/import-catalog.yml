name: Import catalog cards

on:
  push:
    paths:
      - ".github/workflows/import-catalog.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download and optimize cards
        run: |
          set -euo pipefail
          rm -rf speech first-words emotions /tmp/catalog-import
          mkdir -p speech first-words emotions /tmp/catalog-import

          while IFS='|' read -r target name url; do
            [ -z "$url" ] && continue
            echo "Processing $target/$name"
            curl -L --fail --retry 3 "$url" -o "/tmp/catalog-import/source.png"
            base="${name%.png}"
            magick "/tmp/catalog-import/source.png" -strip -quality 88 "$target/$base.webp"
          done < catalog-import-manifest.txt

          echo "Speech: $(find speech -type f -name '*.webp' | wc -l)"
          echo "First words: $(find first-words -type f -name '*.webp' | wc -l)"
          echo "Emotions: $(find emotions -type f -name '*.webp' | wc -l)"

          test "$(find speech -type f -name '*.webp' | wc -l)" -eq 80
          test "$(find first-words -type f -name '*.webp' | wc -l)" -eq 46
          test "$(find emotions -type f -name '*.webp' | wc -l)" -eq 17

      - name: Commit optimized catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speech first-words emotions
          git commit -m "Add optimized catalog cards" || echo "No changes to commit"
          git push
