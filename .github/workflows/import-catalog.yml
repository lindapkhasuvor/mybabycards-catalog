name: Import catalog cards

on:
  push:
    paths:
      - ".github/workflows/import-catalog.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip

      - name: Download and optimize cards
        env:
          SPEECH_URL: "https://www.dropbox.com/scl/fo/17uz4dtrppvrsoqu4lewu/AA1J10NDck4WPpY9LR8Hnv4?rlkey=bpjb9y7d1p04u3vg0x13nwbel&st=dl86o9jx&dl=1"
          WORDS_URL: "https://www.dropbox.com/scl/fo/fm5krmajx6sdash12vcn8/AB11kYE_vF4pksnDAF-kP2o?rlkey=qx322eg6e5znqmsd2gn8e3np&st=ox6a5y4g&dl=1"
          EMOTIONS_URL: "https://www.dropbox.com/scl/fo/o4ke6pbhuip762tibkj6l/AP5P_M-KAxdax_BU_a45HaA?rlkey=35egacdqqikt63h8qwta79nkj&st=c3zj1qmv&dl=1"
        run: |
          set -euo pipefail

          rm -rf /tmp/catalog-import
          mkdir -p /tmp/catalog-import/downloads /tmp/catalog-import/unpacked

          curl -L --fail --retry 3 "$SPEECH_URL" -o /tmp/catalog-import/downloads/speech.zip
          curl -L --fail --retry 3 "$WORDS_URL" -o /tmp/catalog-import/downloads/words.zip
          curl -L --fail --retry 3 "$EMOTIONS_URL" -o /tmp/catalog-import/downloads/emotions.zip

          unzip -q /tmp/catalog-import/downloads/speech.zip -d /tmp/catalog-import/unpacked/speech
          unzip -q /tmp/catalog-import/downloads/words.zip -d /tmp/catalog-import/unpacked/words
          unzip -q /tmp/catalog-import/downloads/emotions.zip -d /tmp/catalog-import/unpacked/emotions

          rm -rf speech first-words emotions
          mkdir -p speech first-words emotions

          convert_group() {
            local source_dir="$1"
            local target_dir="$2"
            find "$source_dir" -type f -iname '*.png' -print0 |
              while IFS= read -r -d '' src; do
                name="$(basename "$src" .png)"
                magick "$src" -strip -quality 88 "$target_dir/$name.webp"
              done
          }

          convert_group /tmp/catalog-import/unpacked/speech speech
          convert_group /tmp/catalog-import/unpacked/words first-words
          convert_group /tmp/catalog-import/unpacked/emotions emotions

          echo "Speech: $(find speech -type f -name '*.webp' | wc -l)"
          echo "First words: $(find first-words -type f -name '*.webp' | wc -l)"
          echo "Emotions: $(find emotions -type f -name '*.webp' | wc -l)"

      - name: Commit optimized catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speech first-words emotions
          git commit -m "Add optimized catalog cards" || echo "No changes to commit"
          git push

# trigger import
