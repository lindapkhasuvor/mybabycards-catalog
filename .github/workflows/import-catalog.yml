name: Import catalog cards

on:
  push:
    paths:
      - ".github/workflows/import-catalog.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download and optimize cards
        run: |
          set -euo pipefail
          rm -rf speech first-words emotions /tmp/catalog-import
          mkdir -p speech first-words emotions /tmp/catalog-import

          cat > /tmp/catalog-import/manifest.txt <<'EOF'
